<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGKT Practice</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav class="nav"><a href="/">Assessment</a><a class="cur" href="/practice.html">Practice</a><a href="/dashboard.html">Dashboard</a></nav>
  <h1>Practice</h1>
  <p class="sub">Pick one topic. After each answer you see the right option, and your mastery estimate moves.</p>

  <section id="pick" class="card">
    <p><select id="topic" class="big"></select> <button id="go">Start practice</button> <span id="err" class="tag"></span></p>
  </section>

  <section id="quiz" class="card hide">
    <div class="tag" id="head"></div>
    <h2 id="qtext"></h2>
    <div id="opts"></div>
    <div id="fb" class="fb hide"></div>
    <p><button id="submit" disabled>Submit answer</button> <button id="next" class="hide">Next question</button></p>
    <div class="row"><span>Mastery estimate</span><div class="bar"><i id="pbar" style="width:30%; background:var(--warn)"></i></div><span id="ptxt">0.30</span></div>
    <p class="tag">Answers given: <span id="cnt">0</span>. <a class="plink" href="/practice.html">Change topic</a></p>
  </section>
</main>
<script src="/common.js"></script>
<script>
let sid = null, qid = null, choice = null;
const $ = id => document.getElementById(id);

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
  return r.json();
}

function setBar(p, status) {
  $('pbar').style.width = Math.round(p * 100) + '%';
  $('pbar').style.background = 'var(--' + (status === 'OK' ? 'ok' : status === 'WEAK' ? 'weak' : 'warn') + ')';
  $('ptxt').textContent = p.toFixed(2);
}

async function init() {
  const g = await api('/graph');
  $('topic').innerHTML = g.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  const want = new URLSearchParams(location.search).get('topic');
  if (want && g.some(t => t.id === want)) $('topic').value = want;
}

$('go').onclick = async () => {
  try {
    const r = await api('/practice', 'POST', { topic: $('topic').value, studentCode: dgktStudentCode(), nickname: dgktNickname() });
    sid = r.sessionId;
    $('head').textContent = 'Topic: ' + r.topicName;
    $('pick').classList.add('hide'); $('quiz').classList.remove('hide');
    await nextQuestion();
  } catch (e) { $('err').textContent = e.message; }
};

async function nextQuestion() {
  const q = await api(`/practice/${sid}/next`);
  qid = q.questionId; choice = null;
  $('submit').disabled = true; $('submit').classList.remove('hide'); $('next').classList.add('hide');
  $('fb').classList.add('hide');
  $('qtext').textContent = q.text;
  $('opts').innerHTML = '';
  q.options.forEach((o, i) => {
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = o;
    b.onclick = () => { choice = i; document.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); $('submit').disabled = false; };
    $('opts').appendChild(b);
  });
}

$('submit').onclick = async () => {
  $('submit').disabled = true;
  const f = await api(`/practice/${sid}/answer`, 'POST', { questionId: qid, choice });
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  btns[f.correctIndex].classList.add('right');
  if (!f.correct) btns[choice].classList.add('wrong');
  $('fb').className = 'fb ' + (f.correct ? 'good' : 'bad');
  $('fb').innerHTML = `<b>${f.correct ? 'Correct.' : 'Not correct.'}</b> ${f.message}`;
  setBar(f.pAfter, f.status);
  $('cnt').textContent = f.answered;
  $('submit').classList.add('hide'); $('next').classList.remove('hide');
};

$('next').onclick = nextQuestion;
init();
</script>
</body>
</html>
