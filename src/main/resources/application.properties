spring.application.name=dgkt
# Render (and most hosts) give the port in the PORT variable. Locally it is 8080.
server.port=${PORT:8080}

# File database (H2). Created automatically in the data/ folder on first start.
spring.datasource.url=jdbc:h2:file:./data/dgkt-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Optional PIN for the "Clear all data" button. Set the RESET_PIN variable on Render to lock it. Empty = no PIN.
reset.pin=${RESET_PIN:}
